  <script>
    const canvas = document.querySelector('#mist');
    const context = canvas.getContext('2d');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');

    // Every noise grid wraps on both axes, so repeating the texture leaves no seam.
    function makeTexture() {
      const texture = document.createElement('canvas');
      const width = texture.width = 512;
      const height = texture.height = 256;
      const brush = texture.getContext('2d');
      const image = brush.createImageData(width, height);

      const octaves = [
        [3, 7, .48], [6, 14, .28], [12, 28, .15], [24, 56, .09]
      ].map(([columns, rows, weight]) => ({
        columns, rows, weight, values: Float32Array.from({ length: columns * rows }, () => Math.random())
      }));

      const blend = (a, b, t) => a + (b - a) * t;
      const smooth = t => t * t * (3 - 2 * t);

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let density = 0;
          for (const { columns, rows, weight, values } of octaves) {
            const u = x * columns / width;
            const v = y * rows / height;
            const i = Math.floor(u);
            const j = Math.floor(v);
            const nextI = (i + 1) % columns;
            const nextJ = (j + 1) % rows;
            const horizontal = smooth(u - i);
            const top = blend(values[j * columns + i], values[j * columns + nextI], horizontal);
            const bottom = blend(values[nextJ * columns + i], values[nextJ * columns + nextI], horizontal);
            density += weight * blend(top, bottom, smooth(v - j));
          }

          const pixel = (y * width + x) * 4;
          image.data[pixel] = 212;
          image.data[pixel + 1] = 243;
          image.data[pixel + 2] = 240;
          image.data[pixel + 3] = Math.round(110 * Math.max(0, (density - .19) / .81) ** 1.8);
        }
      }

      brush.putImageData(image, 0, 0);
      return texture;
    }

    const texture = makeTexture();
    const layers = [
      { width: 1.3, height: 1.1, x: .18, y: .27, period: 112, opacity: .62 },
      { width: 2.1, height: 1.5, x: .51, y: .56, period: 74, opacity: .56 },
      { width: 3.2, height: 2.1, x: .67, y: .14, period: 48, opacity: .48 }
    ];

    let frame;
    function paint(seconds) {
      const { width, height } = canvas;
      context.clearRect(0, 0, width, height);

      for (const layer of layers) {
        const tileWidth = width * layer.width;
        const tileHeight = height * layer.height;
        const phase = seconds / layer.period;
        const left = -tileWidth * ((layer.x + phase) % 1);
        const top = tileHeight * (((layer.y + phase) % 1) - 1);

        context.globalAlpha = layer.opacity;
        for (let y = top; y < height; y += tileHeight) {
          for (let x = left; x < width; x += tileWidth) {
            context.drawImage(texture, x, y, tileWidth, tileHeight);
          }
        }
      }
    }

    function animate(time) {
      paint(time / 1000);
      frame = requestAnimationFrame(animate);
    }

    function updateMotion() {
      cancelAnimationFrame(frame);
      if (motion.matches) {
        paint(0);
      } else {
        frame = requestAnimationFrame(animate);
      }
    }

    function resize() {
      const scale = Math.min(devicePixelRatio || 1, 1.5);
      canvas.width = Math.max(1, Math.round(innerWidth * scale));
      canvas.height = Math.max(1, Math.round(innerHeight * scale));
      updateMotion();
    }

    if (context) {
      window.addEventListener('resize', resize);
      motion.addEventListener('change', updateMotion);
      resize();
    }
  </script>
